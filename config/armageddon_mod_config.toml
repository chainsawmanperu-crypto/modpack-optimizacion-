["Lore Scrolls"]

	["Lore Scrolls"."Iron Colossus Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		iron_colossus_lore_scroll = ["The Iron Colossus was an ancient golem, far more powerful than those of modern times. It was built by the Ancients Builders, its body adorned with streams of pure iron, and an allium flower had even grown on its head, a symbol of life within the metal. Forged to protect, it sustained heavy damage during The Armageddon War. In a final desperate act, it was designated as the Iron Keeper, the guardian of iron, to ensure that no one would wield its power. Unfortunately, it failed, condemned to wander the depths, guarding the secrets it could not defend."]

	["Lore Scrolls"."The Goblin Lord Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		goblin_lord_lore_scroll = ["Being a member of the ancient faction of goblins that once ruled over gold, the Goblin Lord was one of the few survivors after the total annihilation of his clan. Once known for his cowardly nature, he took advantage of the chaos to self-proclaim himself as the lord and guardian of gold. His boundless ambition allowed him to seize not only the treasures of his fallen people but also those of the golden depths. After demonstrating his strength and determination to protect gold at all costs, he too will ultimately fail..."]

	["Lore Scrolls"."Arion Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		arion_lore_scroll = ["Arion, once a simple Illager from ancient times, became a great soldier during the Armageddon War. A formidable strategist and warrior, he transcended his humble status by defeating numerous Ancient Builders, therefore seizing the mystical power of the emeralds. Impressed by his strength and cunning, his peers appointed him as the Emerald Keeper, bestowing upon him ancient artifacts to perfect his mastery. He was even named Arion, Tyrant of the Emerald Wrath by his mates. And now, Arion guards this power, with ambitions matched only by his thirst for domination."]

	["Lore Scrolls"."Eldorath Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		eldorath_lore_scroll = ["The Ancient Builders were simply the most advanced form of life in ancient times. They mastered all ores, all resources, and more: a form of magic that, while not highly advanced, was powerful enough to create entities like the Wither. They had understood how to survive in this world, and their constructions today stand as remnants of their intelligence. Unfortunately for them, during the Armageddon War, they were forced into hiding, particularly in the Nether and the End. Their fallen souls adapted, transforming into Endermen or Piglins, desperately trying to return to the Overworld at any cost. Eldorath, however, managed to escape all of this, and thanks to his boundless knowledge, he proclaimed himself the Diamond Keeper, the guardian of the Overworld..."]

	["Lore Scrolls"."Zoranth Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		zoranth_lore_scroll = ["Once an explorer among the Ancient Builders, Zoranth was sent after the Armageddon War to the Nether, a land still scarcely explored at that time despite the power of his people. His mission was to find the villagers who had been condemned to wander in this dimension, forced to become piglins or other creatures. Unfortunately, Zoranth and his troupe did not escape this fate. After a few years, the portal closed, likely deliberately. It took only a few days for Zoranth's troupe to transform... Yet, he managed to evade this fate, consumed instead by the rage of betrayal and a desire for revenge, even though, unbeknownst to him, his people had already perished..."]

	["Lore Scrolls"."Elvenite Paladin Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		elvenite_paladin_lore_scroll = ["The Elvenite Paladin was once a mighty automaton, crafted by the Ancient Builders to protect their village from external threats. Unlike today’s iron golems, it was forged from Elvenite, a legendary material that radiates mystical energy. This paladin did not merely defend; it watched over the ancient Builders' secrets, guarding lost knowledge and forgotten artifacts. Over time, its mission became eternal, continuing to protect the Builders' ruins, though they vanished long ago. It remains ever-vigilant, ready to face any threat that may arise."]

	["Lore Scrolls"."Vaedric Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		vaedric_lore_scroll = ["Vaedric was once a valiant soldier, a hero who dared to challenge the Ender Dragon and clash with Khyros himself. But his courage came at a price. After weakening the Ender Dragon, Khyros, merciless and cruel, condemned him to an endless fall into the depths of the Void. There, he slowly lost his humanity, his body warped by the darkness. He reemerged much later, part Enderman, a specter haunted by his failure, unable to distinguish friend from foe. Now, he roams the shadows, consumed by rage and despair."]

	["Lore Scrolls"."BoD Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		bod_lore_scroll = ["A mysterious being from a forgotten plane of existence, the Bringer of Doom serves as the harbinger of the apocalypse. Its presence heralds the awakening of Khyros and the arrival of the Three Calamities. Tasked with preparing the world for its inevitable fall, it spreads despair and chaos wherever it treads, forcing mortals to confront their own fragility. Though it serves Khyros, its true allegiance remains shrouded in mystery. Some say it feeds on the destruction it creates; others believe it is a primordial force, as ancient as time itself. One thing is certain: wherever it walks, hope fades."]

	["Lore Scrolls"."The Chaos Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		the_chaos_lore_scroll = ["Wrought from the unbridled malice of Khyros, The Chaos was summoned as the Second Calamity, a vessel of relentless destruction forged from a shard of his cataclysmic essence. Its arrival is heralded by skies ablaze with unnatural fire and the panicked cries of those who witness its coming. Chaos obeys no law, no master — not even Khyros himself for it was made to unbind the world's order, to fracture reason, and to drown the realms in madness. Its demonic laughter is a grim omen, for wherever it treads, kingdoms fall to ruin, and brother turns against brother. It craves nothing but to watch the world collapse in a tide of pure, unrelenting anarchy."]

	["Lore Scrolls"."The Famine Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		the_famine_lore_scroll = ["Born from the abyssal will of Khyros, The Famine was forged as the first of the Calamities a living vessel for a fragment of his boundless, ruinous power. Created to rend the balance of life itself, she is the creeping shadow of starvation, devouring harvests, beasts, and souls alike. Where she walks, the land rots, and a hunger without end consumes all. Khyros did not craft her for conquest, but for torment to wither the world’s strength, sow despair, and prepare the realm for his final ascension. She is not merely a beast, but a curse incarnate, a herald of a world undone by its creator’s hand."]

	["Lore Scrolls"."The Discord Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		the_discord_lore_scroll = ["Fashioned by Khyros as the Fourth Calamity, The Discord was born not of strength, but of treachery. A fragment of his deceitful will given form, she whispers through the winds, corrupting minds and dividing hearts. Where her influence spreads, friendships wither, loyalties fracture, and kingdoms crumble without a single blow struck. She is the unseen force that poisons unity, turning brother against brother, and leader against kin. Her presence is more devastating than any blade or spell, for she causes the world to collapse from within, ensuring that when ruin comes, none will stand together to face it."]

	["Lore Scrolls"."Sanghor Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		sanghor_lore_scroll = ["Long before Khyros emerged, Sanghor wandered the nascent ages of this world. A mage of the first times, he experimented with life and death, shaping the very fabric of existence with forbidden knowledge. His secret? Mastery over blood itself—the essence of life and destiny.  As with all beings of great power, he eventually crossed paths with Khyros. Faced with a superior force, Sanghor forged a pact, trading a part of his freedom for renewed power and unmatched longevity. This pact transformed him into a colossal being: his wings appeared, black as night, and his tears became blood, a symbol of both his power and his damnation.  Now he wanders between shadow and light, mourning his past and watching the world with the wisdom and melancholy of one who has tasted the secrets of life itself."]

	["Lore Scrolls"."Zoranth Newborn Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		zoranth_newborn_lore_scroll = ["After his defeat in the Nether at your hands, Zoranth, consumed by rage and humiliation, knelt before Khyros, pleading for a power that would allow him to reclaim his fate. In exchange for his flesh, his face, and even his convictions, he was granted the essence of the sun itself—an eternal flame burning within his grasp. Stripped of his former humanity, he became nothing more than an avatar of destruction, guided by blind vengeance. But this power was nothing more than a cruel illusion… When defeat struck him one final time, the scorching curse that bound him was extinguished, and at last, Zoranth found freedom."]

	["Lore Scrolls"."Nyxaris Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		nyxaris_lore_scroll = ["Once a warrior without equal, Nyxaris carved his legend in blood and steel, earning the revered title of Legendary Hero. Yet, glory was fleeting, and the weight of his own legacy became a burden. Drawn to a force beyond mortal comprehension, he sought Khyros, not as a foe, but as a master. Admiration turned to devotion, and devotion to surrender. His spear, once wielded for honor and justice, was now an extension of the End’s will. No longer a man, but a shadow, he shed his identity and embraced oblivion, becoming the Veil of Oblivion, eternally bound to the Harbinger’s fate. Yet, within the abyss, a fragment of his former self lingers—a whisper drowned beneath the call of Armageddon. But hesitation is a luxury he no longer possesses."]

	["Lore Scrolls"."Wither Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		wither_lore_scroll = ["The Wither was created by the Ancient Builders as an ultimate weapon during the Armageddon War. In a moment of desperation, they summoned this creature through various forbidden rituals, hoping it would annihilate their enemies. Its power was simply immense. Although they tried to tame it, the Wither was far too strong, and its thirst for destruction prevailed. It was too late... After being defeated in a fierce battle, it was shattered into pieces and scattered across the most dangerous place known at the time: the Nether, which was discovered on that occasion. Nowadays, the Wither waits for someone daring enough to re-summon it, seeking revenge on the world... "]

	["Lore Scrolls"."Warden Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		warden_lore_scroll = ["The Warden, born from the mistakes of the Ancient Builders, watches over the Deep Dark, a shadowy realm filled with mystical energy. Created to protect the ruins and secrets of forgotten civilizations, it serves as both guardian and punisher, hunting down those who venture too close to its forbidden domains. Blind yet highly sensitive to vibrations, it embodies the wrath of the ancient powers it keeps imprisoned. Its presence is a reminder that some forces should never be awakened, and that certain secrets must remain buried in eternal darkness."]

	["Lore Scrolls"."Ender Dragon Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		ender_dragon_lore_scroll = ["Once, the Ender Dragon was Khyros' war hound, spreading destruction under his orders. After the Great War, she was exiled to the End, a cold and empty dimension, destined to guard this realm for eternity. Condemned to remain a captive of the End, she wandered through the void, a prisoner of a curse that prevented her from regaining her freedom. Until her last breath, she tried to protect her egg. Her death, at the hands of a hero, was not merely a defeat, but a liberation. Freed from her eternal bondage, the Ender Dragon finally found peace in death..."]

	["Lore Scrolls"."Elder Guardian Lore Scroll"]
		#You can edit the displayed text for the corresponding Lore Scroll. Write your own lore! Default = /
		elder_guardian_lore_scroll = ["The Elder Guardian was employed by the Ancient Builders to protect their underwater monuments, where invaluable knowledge and treasures were hidden. Forged in the magic of the oceans, it is far more intelligent and powerful than ordinary Guardians. Its skin is as tough as prismarine blocks, and its gaze can paralyze or destroy any threat. As the Ancients mysteriously vanished, the Elder Guardian continued its watch, unwavering, ready to defend these forgotten citadels of the deep against any intruder..."]

